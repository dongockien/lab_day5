# Lab Ngày 5: API -> RabbitMQ -> worker, kèm Postgres (trạng thái job, outbox).
# Mọi cổng chỉ mở trên 127.0.0.1 của máy host. Tài khoản bên dưới chỉ dùng cho lab.
x-app: &app
  build: .
  image: lab_day5_app:latest
  environment: &env
    DATABASE_URL: postgresql://postgres:secret@postgres:5432/lab
    RABBIT_URL: amqp://lab:lab@rabbitmq:5672/%2F
    UPLOAD_DIR: /data/uploads
    INFER_MS: "800"
    LEASE_SECONDS: "5"
    PUBLISH_MODE: ${PUBLISH_MODE:-direct}
  volumes:
    - uploads:/data/uploads

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: lab
    volumes:
      - ./app/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"      # giao diện quản trị: http://localhost:15672 (lab / lab)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  relay:
    <<: *app
    command: ["python", "-m", "app.relay"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: "no"                    # để docker kill thật sự làm worker chết, không tự khởi động lại
    stop_grace_period: 10s

  tools:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *env
      API_URL: http://api:8000
    command: ["python", "-m", "app.bench", "--help"]

volumes:
  pgdata:
  uploads:
